# Grafana datasource provisioning — Loki + Prometheus.
# Loaded automatically at Grafana startup from
# /etc/grafana/provisioning/datasources (mounted in docker-compose.observability.yml).

apiVersion: 1

datasources:

  - name: Loki
    type: loki
    access: proxy
    # `loki` resolves on the obs_internal Docker network — Grafana is
    # attached to both obs_public and obs_internal in the compose file.
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 5000
      # Surface PHI audit job in label dropdowns prominently.
      derivedFields:
        - matcherRegex: '"request_id":"([^"]+)"'
          name: request_id
          url: ""

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
