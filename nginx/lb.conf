# =============================================================================
# nginx load balancer config for HA app server pattern
# =============================================================================
# Activated by docker-compose.ha.yml --profile ha. Round-robin balances
# requests across backend1 and backend2 over the internal docker network.
# DO NOT reference this file from the default (non-HA) compose stack.
# =============================================================================

upstream raf_backend_pool {
    # Round-robin (nginx default). Use `least_conn` if request latency varies
    # widely. `ip_hash` would give pseudo-sticky sessions but breaks when
    # clients share a NAT — prefer stateless backend + Redis sessions instead.

    # max_fails=3 within fail_timeout=30s marks a peer as down; nginx then
    # serves all traffic from the surviving peer until the window expires.
    server backend1:8500 max_fails=3 fail_timeout=30s;
    server backend2:8500 max_fails=3 fail_timeout=30s;

    # Persistent upstream connection pool — avoids reconnect overhead per
    # request and reduces tail latency under load.
    keepalive 32;
}

server {
    listen 8500;
    server_name _;

    # Reasonable upload ceiling for clinical document uploads (PDFs, CCDs).
    client_max_body_size 50m;

    # Allow long-running synchronous endpoints (LLM batch scoring, etc.).
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ---- SSE / streaming endpoints --------------------------------------
    # SSE requires buffering OFF and HTTP/1.1 with Connection: keep-alive,
    # otherwise events arrive in burst at stream close. Add additional
    # prefix matches here as new streaming endpoints land in the API.
    location ~* ^/api/v[0-9]+/(stream|events|sse|notifications) {
        proxy_pass http://raf_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE: do not buffer, flush events to client immediately.
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
    }

    # ---- Default proxy --------------------------------------------------
    location / {
        proxy_pass http://raf_backend_pool;
        proxy_http_version 1.1;
        # Empty Connection header lets nginx reuse upstream keepalive.
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # On 5xx / timeout from one peer, retry the other before failing.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # LB-local health endpoint (does NOT proxy to backend). Cloud LBs /
    # HAProxy in front of this nginx can probe here.
    location = /lb-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
