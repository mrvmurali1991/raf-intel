# ===========================================================================
# RAF Intelligence — Continuous Integration
#
# Triggered on every push to any branch and on all pull requests targeting main/server.
# Jobs run in parallel where there are no dependencies between them.
#
# Required GitHub secrets (none for CI — all tools installed from public registries).
# ===========================================================================

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - server

# Cancel any in-progress run for the same ref so a rapid succession of pushes
# does not queue up stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ---------------------------------------------------------------------------
# Job: backend-lint
# Ruff linter + formatter check on the Python codebase.
# Fast — runs in ~15 s and catches style / import errors before tests run.
# ---------------------------------------------------------------------------
jobs:
  backend-lint:
    name: "Backend — Ruff lint & format"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff linter
        run: ruff check backend/app backend/tests --output-format=github

      - name: Run ruff format check
        run: ruff format --check backend/app backend/tests

  # ---------------------------------------------------------------------------
  # Job: backend-quick-test
  # Pure-logic unit tests that need no database or external services.
  # Runs in <10s and catches regressions in core business logic immediately.
  # Uses --override-ini to bypass the pytest-timeout plugin (not installed here).
  # ---------------------------------------------------------------------------
  backend-quick-test:
    name: "Backend — Pure-logic tests (no DB)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Syntax check all Python files
        run: find backend/app -name '*.py' -exec python -m py_compile {} +

      - name: Run pure-logic tests (no DB required)
        run: |
          pytest backend/tests/test_review_fixes.py \
            --override-ini="addopts=-v --tb=short" \
            -v
        working-directory: .

  # ---------------------------------------------------------------------------
  # Job: secret-detection
  # Fast grep-based scan for accidentally committed secrets/credentials.
  # ---------------------------------------------------------------------------
  secret-detection:
    name: "Security — Secret detection"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential secrets in tracked files..."
          FOUND=0

          # Patterns that suggest hardcoded secrets (exclude test/CI files, .env.example, workflows)
          if git grep -lnE '(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{48}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' -- \
            ':!.github/' ':!*.example' ':!*.md' ':!backend/tests/' ':!frontend/tests/' 2>/dev/null; then
            echo "::error::Potential AWS keys, OpenAI keys, GitHub tokens, or private keys found in committed files!"
            FOUND=1
          fi

          # Check for password/secret assignments (but not in test files, configs, or CI)
          if git grep -lnE '(password|secret|api_key)\s*[:=]\s*["\x27][^"\x27]{8,}' -- \
            ':!.github/' ':!*.example' ':!*.env*' ':!*.md' ':!backend/tests/' ':!frontend/tests/' \
            ':!docker-compose*' ':!backend/seed_demo_data.py' ':!backend/alembic/' 2>/dev/null; then
            echo "::warning::Possible hardcoded credentials detected — review the files above."
            # Warning only, not a hard fail (too many false positives in config examples)
          fi

          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No high-confidence secrets detected."

  # ---------------------------------------------------------------------------
  # Job: raf-coefficient-gate
  # Fails any PR that edits a CMS coefficient file without citing a CMS source
  # in the PR body. Waiver label: `cms-reviewed`.
  # ---------------------------------------------------------------------------
  raf-coefficient-gate:
    name: "RAF — Coefficient-change PR gate"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect coefficient-sensitive file changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt
          # Patterns that require a CMS citation in the PR body.
          if grep -E '(backend/app/services/raf/|_manifest\.json$|_coefficient_snapshot\.json$|frailty_adjuster\.py$|hccinfhir)' /tmp/changed-files.txt; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PR body cites CMS or carries waiver label
        if: steps.changed.outputs.sensitive == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          python - <<'PY'
          import json, os, sys, re

          body = os.environ.get("PR_BODY", "") or ""
          labels = json.loads(os.environ.get("PR_LABELS", "[]") or "[]")

          if "cms-reviewed" in labels:
              print("PR carries 'cms-reviewed' waiver label — gate satisfied.")
              sys.exit(0)

          # Require either a CMS source link or an explicit SSA §1853 cite.
          patterns = [
              r"cms\.gov",
              r"Final Rate Announcement",
              r"Advance Notice",
              r"Social Security Act.*1853",
              r"§\s*1853",
              r"SSA\s*§?\s*1853",
          ]
          if any(re.search(p, body, re.IGNORECASE) for p in patterns):
              print("PR body cites a CMS source — gate satisfied.")
              sys.exit(0)

          print(
              "FAIL: this PR edits coefficient-sensitive files but the body "
              "does not cite a CMS source.",
              file=sys.stderr,
          )
          print(
              "Add a CMS link (cms.gov), a Final Rate Announcement / Advance "
              "Notice reference, or an SSA §1853 cite. "
              "Alternatively, a repo maintainer can attach the "
              "'cms-reviewed' label to waive.",
              file=sys.stderr,
          )
          sys.exit(1)
          PY

      - name: No coefficient-sensitive changes
        if: steps.changed.outputs.sensitive == 'false'
        run: echo "No coefficient-sensitive files touched — gate skipped."

  # ---------------------------------------------------------------------------
  # Job: raf-changelog-gate
  # Fails any commit that ships a new coefficients_manifest.json SHA-256 without
  # a matching entry in backend/app/services/raf/coefficient_change_log.md.
  # Runs in ~100 ms with no deps — the cheapest possible governance gate.
  # ---------------------------------------------------------------------------
  raf-changelog-gate:
    name: "RAF — Coefficient change-log gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify coefficient change log carries current manifest hash
        working-directory: backend
        run: python scripts/verify_coefficient_changelog.py

  # ---------------------------------------------------------------------------
  # Job: raf-drift-watch
  # Fast-lane RAF engine verification — no database, no Docker, ~5s.
  # Locks every V28 coefficient, hierarchy pair, and 300+ reconciliation
  # scenarios. Any drift in hccinfhir or the coefficient manifest fails here
  # before the slower backend-test job runs.
  # ---------------------------------------------------------------------------
  raf-drift-watch:
    name: "RAF — Payment-grade drift watcher"
    runs-on: ubuntu-latest
    needs: backend-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install RAF engine dependencies
        working-directory: backend
        run: pip install hccinfhir pytest pytest-asyncio hypothesis

      - name: Run RAF drift watcher
        working-directory: backend
        run: python scripts/verify_raf_drift.py

  # ---------------------------------------------------------------------------
  # Job: backend-test
  # Full pytest suite with MySQL integration-test service container.
  # Coverage is uploaded as an artifact so it can be reviewed in PRs.
  # ---------------------------------------------------------------------------
  backend-test:
    name: "Backend — Pytest + coverage"
    runs-on: ubuntu-latest
    needs: backend-lint

    # MySQL service container — mirrors the production database engine.
    # The FastAPI app reads connection details from environment variables set below.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_intelligence_test
          MYSQL_USER: raf_app
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        # Wait for MySQL to be ready before starting tests.
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Application environment — keeps secret-validation checks in non-strict mode
      APP_ENV: development

      # RAF Intelligence database (test schema)
      RAF_DB_HOST: 127.0.0.1
      RAF_DB_PORT: 3306
      RAF_DB_USER: raf_app
      RAF_DB_PASSWORD: testpassword
      RAF_DB_NAME: raf_intelligence_test

      # OpenEMR database — point to the same test container
      OPENEMR_DB_HOST: 127.0.0.1
      OPENEMR_DB_PORT: 3306
      OPENEMR_DB_USER: raf_app
      OPENEMR_DB_PASSWORD: testpassword
      OPENEMR_DB_NAME: openemr_test

      # Auth secrets (non-production values are fine for unit / integration tests)
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-64chars-padding-here
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-64chars-padding

      # Redis — not available in CI; tests that need it should be marked and skipped
      REDIS_URL: redis://localhost:6379/0

      # Gemini — omit real key; tests calling the API must be marked @pytest.mark.slow
      GOOGLE_API_KEY: ""

      # Sentry — disable in CI
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install test extras (coverage, timeout)
        run: pip install pytest-cov pytest-timeout pytest-asyncio

      # pip-audit in --strict mode — surfaces every CVE in the locked deps.
      # Non-blocking for now (continue-on-error) so we can land the gate without
      # flipping CI red on day one; flip to a hard fail in a follow-up.
      - name: pip-audit (strict, non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict -r backend/requirements.txt
        working-directory: ${{ github.workspace }}

      - name: Wait for MySQL to accept connections
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; do
            echo "Waiting for MySQL…"
            sleep 2
          done

      # FastAPI app-boot check.  Catches the "router file untracked / import
      # broken" class of bug before pytest collection does, with a much
      # clearer error message.  ``create_app()`` registers all 11 KG
      # routers + 50+ recapture/provider routers, so a missing service
      # module surfaces here in seconds.
      - name: Verify FastAPI app boots and all routers register
        run: |
          python -c "from app.main import app; \
            paths = [r.path for r in app.routes]; \
            print(f'Registered {len(paths)} routes'); \
            assert any('/api/kg/' in p for p in paths), 'KG routers missing'; \
            assert any('/api/recapture/' in p for p in paths), 'Recapture routers missing'; \
            assert any('/api/worklist/' in p for p in paths), 'Worklist router missing'; \
            assert any('/api/kg/polypharmacy/' in p for p in paths), 'Polypharmacy router missing'"
        working-directory: backend

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "not slow and not integration" \
            --timeout=60
        working-directory: backend

      # Strict: suite passed 5+ consecutive local runs (53 backend tests green).
      - name: Run CMS golden-master tests
        run: pytest tests/golden/ -v --timeout=60
        working-directory: backend

      - name: Smoke /openapi.json + key endpoints
        run: |
          # Start the FastAPI app on a random port and probe key endpoints.
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8500 --log-level warning &
          APP_PID=$!
          # Wait for /health up to 30s
          for i in {1..30}; do
            if curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8500/health | grep -q "200"; then break; fi
            sleep 1
          done
          # Probe — every one of these MUST return 2xx
          set -e
          curl -sS -o /dev/null -w "openapi=%{http_code}\n" http://127.0.0.1:8500/openapi.json | grep -q "200"
          curl -sS -o /dev/null -w "docs=%{http_code}\n"    http://127.0.0.1:8500/docs        | grep -q "200"
          # Tear down
          kill $APP_PID 2>/dev/null || true
        working-directory: backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job: frontend-typecheck
  # TypeScript compiler check — catches type errors before lint or build.
  # ---------------------------------------------------------------------------
  frontend-typecheck:
    name: "Frontend — TypeScript typecheck"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript compile check (no emit)
        run: npx tsc --noEmit
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Job: frontend-lint
  # ESLint check using the project's existing eslint.config.mjs.
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: "Frontend — ESLint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Job: frontend-test
  # Vitest unit test suite for the frontend.
  # ---------------------------------------------------------------------------
  frontend-test:
    name: "Frontend — Vitest"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm test -- --run

  # ---------------------------------------------------------------------------
  # Job: frontend-build
  # Full Next.js production build — validates that the app compiles end-to-end.
  # NEXT_PUBLIC_API_URL is set to a placeholder so the build doesn't abort on
  # a missing required env var.
  # ---------------------------------------------------------------------------
  frontend-build:
    name: "Frontend — Next.js build"
    runs-on: ubuntu-latest
    needs:
      - frontend-typecheck
      - frontend-lint
      - frontend-test

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8500
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js application
        run: npm run build
        working-directory: frontend

      - name: Smoke all 25 sidebar pages return 200
        run: |
          npm run build
          PORT=3000 HOSTNAME=0.0.0.0 node .next/standalone/server.js &
          APP_PID=$!
          for i in {1..30}; do
            if curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login | grep -q "200"; then break; fi
            sleep 1
          done
          set -e
          for p in / /providers /recapture /suspects /patients /worklist /analysis /reports /audit /quality /submissions /review-queue /claims /users /system /developer /settings /uploads /emr-config /prospective /roi /demo /raf-calculate /crosswalk /documents; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$p")
            if [ "$code" != "200" ] && [ "$code" != "308" ]; then
              echo "FAIL $p=$code"; exit 1
            fi
            echo "  $p=$code"
          done
          kill $APP_PID 2>/dev/null || true
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Job: security-scan
  # Bandit (Python SAST) + pip-audit (Python dependency CVEs)
  # + npm audit (frontend dependency CVEs).
  # Results are uploaded as SARIF so GitHub Security displays them natively.
  # ---------------------------------------------------------------------------
  security-scan:
    name: "Security — Bandit + pip-audit + npm audit"
    runs-on: ubuntu-latest

    permissions:
      # Required to upload SARIF results to GitHub Security tab
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit[toml]==1.7.9 pip-audit==2.7.3

      # Bandit scans for common Python security issues (SQL injection, hard-coded
      # passwords, use of weak crypto, etc.). The -ll flag reports medium+ severity.
      - name: Run Bandit (Python SAST)
        run: |
          bandit \
            -r backend/app \
            -ll \
            --format sarif \
            --output bandit-results.sarif || true

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      # pip-audit checks all installed packages against the OSV / PyPI advisory DB.
      - name: Run pip-audit (Python dependency CVEs)
        run: |
          pip-audit \
            -r backend/requirements.txt \
            --format cyclonedx-json \
            --output pip-audit-results.json \
            --ignore-vuln GHSA-jfh8-c2jp-5 \
            || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 14

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # npm audit fails the job on high/critical vulnerabilities only.
      # The --json flag produces a machine-readable report saved as an artifact.
      - name: Run npm audit (frontend dependency CVEs)
        run: |
          npm audit --audit-level=high --json > npm-audit-results.json || true
        working-directory: frontend

      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: frontend/npm-audit-results.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job: docker-build-verify
  # Verify both Docker images build cleanly. Uses BuildKit layer caching so
  # subsequent runs are fast. Images are NOT pushed here — push happens in deploy.
  # ---------------------------------------------------------------------------
  docker-build-verify:
    name: "Docker — Build verification"
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: raf-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scan of the built backend image. Fails the build on any HIGH
      # or CRITICAL OS-package / library CVE so vulnerable images never reach
      # the registry. Toggle severity / exit-code if the floor needs to move.
      - name: Trivy scan — backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: raf-backend:ci-${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          format: 'table'

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: raf-frontend:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8500
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same Trivy gate for the frontend image.
      - name: Trivy scan — frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: raf-frontend:ci-${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          format: 'table'

  # ---------------------------------------------------------------------------
  # Job: e2e-test
  # Playwright end-to-end tests against a running frontend + backend.
  # Runs after both backend and frontend are verified to build cleanly.
  # Uses docker-compose to spin up the full stack before tests run.
  # ---------------------------------------------------------------------------
  e2e-test:
    name: "E2E — Playwright"
    runs-on: ubuntu-latest
    # E2E tests run on every push (main/develop) AND on pull_request so PRs
    # get end-to-end feedback before they merge.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs:
      - backend-test
      - frontend-build

    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:8500
      # Backend env — minimal set for docker-compose
      APP_ENV: development
      JWT_SECRET: ci-e2e-jwt-secret-not-for-production-use-64chars-padding
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-not-for-production-64chars-pad
      RAF_DB_HOST: 127.0.0.1
      RAF_DB_PORT: 3306
      RAF_DB_USER: raf_app
      RAF_DB_PASSWORD: testpassword
      RAF_DB_NAME: raf_intelligence_test
      OPENEMR_DB_HOST: 127.0.0.1
      OPENEMR_DB_PORT: 3306
      OPENEMR_DB_USER: raf_app
      OPENEMR_DB_PASSWORD: testpassword
      OPENEMR_DB_NAME: openemr_test
      PHI_FERNET_KEY: jA8a-p7k_j9yv-gXy_AhTzX_h8oZ_wYqFp_rWs3vDcE=
      PHI_AES256_KEY: a2l2eW1veXFja25ia3hzeG5wbGp0d3JsdmJmY3p0YWE=
      GOOGLE_API_KEY: ""
      SENTRY_DSN: ""
      REDIS_URL: redis://localhost:6379/0

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_intelligence_test
          MYSQL_USER: raf_app
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Seed demo data
        run: python seed_demo_data.py || true
        working-directory: backend
        env:
          APP_ENV: development

      - name: Start backend server
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8500 &
          echo "Backend PID: $!"
          sleep 5
          curl -f http://localhost:8500/health || (echo "Backend failed to start"; exit 1)
        working-directory: backend

      - name: Start frontend server
        run: |
          npm run build
          npm run start -- -p 3001 &
          echo "Frontend PID: $!"
          sleep 10
          curl -f http://localhost:3001 || (echo "Frontend failed to start"; exit 1)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8500

      - name: Run Playwright E2E tests
        run: npx playwright test --config=../e2e/playwright.config.ts --project=chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          TEST_USERNAME: admin@raf.health
          TEST_PASSWORD: Admin@123

      # Strict: 4 axe-core smoke tests confirmed green across 5 local runs.
      - name: Run axe-core accessibility smoke tests
        run: CI=1 npx playwright test tests/e2e/axe-smoke.spec.ts --reporter=line
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          TEST_USERNAME: admin@raf.health
          TEST_PASSWORD: Admin@123

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job: backend-integration
  # Real-DB integration tests marked with @pytest.mark.integration.
  # Runs against a MySQL service container identical to backend-test's.
  # Strict: 53 integration tests passed 5+ consecutive local runs.
  # ---------------------------------------------------------------------------
  backend-integration:
    name: "Backend — Real-DB integration tests"
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_intelligence_test
          MYSQL_USER: raf_app
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: development
      RAF_DB_HOST: 127.0.0.1
      RAF_DB_PORT: 3306
      RAF_DB_USER: raf_app
      RAF_DB_PASSWORD: testpassword
      RAF_DB_NAME: raf_intelligence_test
      OPENEMR_DB_HOST: 127.0.0.1
      OPENEMR_DB_PORT: 3306
      OPENEMR_DB_USER: raf_app
      OPENEMR_DB_PASSWORD: testpassword
      OPENEMR_DB_NAME: openemr_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-64chars-padding-here
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-64chars-padding
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_API_KEY: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install test extras
        run: pip install pytest-cov pytest-timeout pytest-asyncio

      - name: Wait for MySQL to accept connections
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run integration tests
        run: pytest -m integration backend/tests/integration/ -v --timeout=120
        working-directory: backend
