name: Backend CI

on:
  pull_request:
    branches: [server, feat/all-gaps-fix]
  push:
    branches: [server, feat/all-gaps-fix]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  BACKEND_DIR: backend

jobs:
  # ─────────────────────────────────────────────
  # Lint: ruff + mypy (lenient, --ignore-missing-imports)
  # ─────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: ruff check
        run: ruff check ${{ env.BACKEND_DIR }}/

      - name: mypy (lenient)
        run: mypy ${{ env.BACKEND_DIR }}/app --ignore-missing-imports

  # ─────────────────────────────────────────────
  # Unit tests (no integration marker)
  # ─────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    # Soft-gate: flaky unit tests should not block merges until suite is stabilised
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_db
          MYSQL_USER: raf
          MYSQL_PASSWORD: rafpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: raf_db
      DB_USER: raf
      DB_PASSWORD: rafpassword
      DB_SSL_ENABLED: "false"
      REDIS_URL: redis://localhost:6379/0
      # Gemini key intentionally blank — unit tests must not call external APIs
      GOOGLE_API_KEY: ""
      SECRET_KEY: ci-test-secret-key-not-used-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ env.BACKEND_DIR }}/.venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Create virtualenv + install deps
        run: |
          python -m venv ${{ env.BACKEND_DIR }}/.venv
          ${{ env.BACKEND_DIR }}/.venv/bin/pip install --upgrade pip
          ${{ env.BACKEND_DIR }}/.venv/bin/pip install -r ${{ env.BACKEND_DIR }}/requirements.txt
          ${{ env.BACKEND_DIR }}/.venv/bin/pip install pytest pytest-timeout pytest-asyncio

      - name: Run unit tests
        run: |
          cd ${{ env.BACKEND_DIR }}
          .venv/bin/pytest tests/ -m "not integration" --no-cov -q --timeout=30

  # ─────────────────────────────────────────────
  # Integration tests (allowed to fail — soft gate)
  # ─────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: unit-test
    # Allowed to fail — requires live infra secrets
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_db
          MYSQL_USER: raf
          MYSQL_PASSWORD: rafpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: raf_db
      DB_USER: raf
      DB_PASSWORD: rafpassword
      DB_SSL_ENABLED: "false"
      REDIS_URL: redis://localhost:6379/0
      # TODO: wire GOOGLE_API_KEY from org secret once integration suite is stable
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SECRET_KEY: ci-test-secret-key-not-used-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ env.BACKEND_DIR }}/.venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install deps
        run: |
          python -m venv ${{ env.BACKEND_DIR }}/.venv
          ${{ env.BACKEND_DIR }}/.venv/bin/pip install --upgrade pip
          ${{ env.BACKEND_DIR }}/.venv/bin/pip install -r ${{ env.BACKEND_DIR }}/requirements.txt
          ${{ env.BACKEND_DIR }}/.venv/bin/pip install pytest pytest-timeout pytest-asyncio

      - name: Run integration tests
        run: |
          cd ${{ env.BACKEND_DIR }}
          .venv/bin/pytest tests/ -m integration --no-cov -q --timeout=30

  # ─────────────────────────────────────────────
  # Security: bandit + pip-audit
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan (bandit + pip-audit)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: bandit SAST
        run: bandit -r ${{ env.BACKEND_DIR }}/app/ -ll -ii

      - name: pip-audit
        run: |
          pip-audit -r ${{ env.BACKEND_DIR }}/requirements.txt \
            --skip-editable \
            --output=json \
            --output-file=pip-audit-report.json || true
          # Display summary; non-zero exit only on HIGH severity (see pip-audit docs)
          pip-audit -r ${{ env.BACKEND_DIR }}/requirements.txt --skip-editable

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ─────────────────────────────────────────────
  # Docker build + Trivy scan for HIGH/CRITICAL CVEs
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build + Trivy Scan
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BACKEND_DIR }}
          push: false
          tags: raf-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: raf-backend:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-backend
