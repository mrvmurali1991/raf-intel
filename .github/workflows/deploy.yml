# RAF Intelligence - Deploy `local` branch to 10.1.0.204 via jump host
#
# Trigger: push to `local` branch, or manual workflow_dispatch
#
# Required GitHub Secrets:
#   PROD_HOST     = 10.1.0.204
#   PROD_USER     = ubuntu
#   PROD_SSH_KEY  = private key authorised on 10.1.0.204
#   JUMP_HOST     = 15.204.73.232
#   JUMP_PORT     = 2222
#   JUMP_USER     = ubuntu
#   JUMP_SSH_KEY  = private key authorised on the jump host
#
# Optional GitHub Variables:
#   PROD_DEPLOY_PATH = /home/ubuntu/raf-intelligence
#   DEPLOY_BRANCH    = local

name: Deploy local to server

on:
  push:
    branches: [local]
  workflow_dispatch:

concurrency:
  group: deploy-local
  cancel-in-progress: false

jobs:
  test:
    name: "Backend — Pytest (pre-deploy gate)"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_intelligence_test
          MYSQL_USER: raf_app
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: development
      RAF_DB_HOST: 127.0.0.1
      RAF_DB_PORT: 3306
      RAF_DB_USER: raf_app
      RAF_DB_PASSWORD: testpassword
      RAF_DB_NAME: raf_intelligence_test
      OPENEMR_DB_HOST: 127.0.0.1
      OPENEMR_DB_PORT: 3306
      OPENEMR_DB_USER: raf_app
      OPENEMR_DB_PASSWORD: testpassword
      OPENEMR_DB_NAME: openemr_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-64chars-padding-here
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-64chars-padding
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_API_KEY: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install test extras
        run: pip install pytest-cov pytest-timeout pytest-asyncio

      - name: Wait for MySQL to accept connections
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run pytest
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -m "not slow and not integration" \
            --timeout=60
        working-directory: backend

  deploy:
    name: Deploy to 10.1.0.204
    runs-on: ubuntu-latest
    environment: production
    needs: [test]
    steps:
      - name: SSH deploy via jump host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          proxy_host: ${{ secrets.JUMP_HOST }}
          proxy_port: ${{ secrets.JUMP_PORT }}
          proxy_username: ${{ secrets.JUMP_USER }}
          proxy_key: ${{ secrets.JUMP_SSH_KEY }}
          timeout: 600s
          command_timeout: 30m
          envs: DEPLOY_PATH,BRANCH,REPO_URL
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.PROD_DEPLOY_PATH || '/home/ubuntu/raf-intelligence' }}"
            BRANCH="${{ vars.DEPLOY_BRANCH || 'local' }}"
            REPO_URL="https://github.com/mrvmurali1991/raf-intel.git"

            echo "==> Deploying ${BRANCH} to ${DEPLOY_PATH}"

            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              [ -f "${DEPLOY_PATH}/.env" ] && cp "${DEPLOY_PATH}/.env" /tmp/raf.env.bak || true
              rm -rf "${DEPLOY_PATH}.new"
              git clone --branch "${BRANCH}" --depth 1 "${REPO_URL}" "${DEPLOY_PATH}.new"
              [ -d "${DEPLOY_PATH}" ] && mv "${DEPLOY_PATH}" "${DEPLOY_PATH}.old.$(date +%s)"
              mv "${DEPLOY_PATH}.new" "${DEPLOY_PATH}"
              [ -f /tmp/raf.env.bak ] && cp /tmp/raf.env.bak "${DEPLOY_PATH}/.env" || true
            else
              cd "${DEPLOY_PATH}"
              git fetch origin "${BRANCH}"
              git checkout "${BRANCH}" 2>/dev/null || git checkout -b "${BRANCH}" "origin/${BRANCH}"
              git reset --hard "origin/${BRANCH}"
            fi

            cd "${DEPLOY_PATH}"
            echo "==> HEAD: $(git rev-parse --short HEAD)"

            if [ ! -f .env ]; then
              echo "ERROR: .env missing at ${DEPLOY_PATH}/.env" >&2
              exit 1
            fi

            chmod +x deploy.sh
            ./deploy.sh
            echo "==> Deploy complete on $(hostname)"
