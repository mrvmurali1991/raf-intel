# RAF Intelligence — Deploy `local` branch to production via jump host
#
# Trigger: push to `local` branch, or manual workflow_dispatch
#
# Required GitHub Secrets:
#   PROD_HOST         = 10.1.0.204
#   PROD_USER         = ubuntu
#   PROD_SSH_KEY      = private key authorised on 10.1.0.204
#   JUMP_HOST         = 15.204.73.232
#   JUMP_PORT         = 2222
#   JUMP_USER         = ubuntu
#   JUMP_SSH_KEY      = private key authorised on the jump host
#
# Optional GitHub Secrets (for notifications):
#   WEBHOOK_URL       = Slack/Teams incoming webhook URL
#
# Optional GitHub Variables:
#   PROD_DEPLOY_PATH  = /home/ubuntu/raf-intelligence
#   DEPLOY_BRANCH     = local

name: Deploy local to server

on:
  push:
    branches: [local]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "Skip DB migration (emergency only)"
        type: boolean
        default: false

concurrency:
  group: deploy-local
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: Unit tests
  # ---------------------------------------------------------------------------
  test:
    name: "Backend — Pytest (pre-deploy gate)"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_intelligence_test
          MYSQL_USER: raf_app
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: development
      RAF_DB_HOST: 127.0.0.1
      RAF_DB_PORT: 3306
      RAF_DB_USER: raf_app
      RAF_DB_PASSWORD: testpassword
      RAF_DB_NAME: raf_intelligence_test
      OPENEMR_DB_HOST: 127.0.0.1
      OPENEMR_DB_PORT: 3306
      OPENEMR_DB_USER: raf_app
      OPENEMR_DB_PASSWORD: testpassword
      OPENEMR_DB_NAME: openemr_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-64chars-padding-here
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-64chars-padding
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_API_KEY: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install test extras
        run: pip install pytest-cov pytest-timeout pytest-asyncio

      - name: Wait for MySQL to accept connections
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run pytest
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -m "not slow and not integration" \
            --timeout=60
        working-directory: backend

  # ---------------------------------------------------------------------------
  # Gate 2: DB migration dry-run (verify alembic heads are reachable)
  # ---------------------------------------------------------------------------
  migration-check:
    name: "DB migration dry-run"
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ !inputs.skip_migration }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: raf_intelligence_test
          MYSQL_USER: raf_app
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: development
      RAF_DB_HOST: 127.0.0.1
      RAF_DB_PORT: 3306
      RAF_DB_USER: raf_app
      RAF_DB_PASSWORD: testpassword
      RAF_DB_NAME: raf_intelligence_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-64chars-padding-here
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-64chars-padding
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Alembic upgrade head (CI DB)
        run: alembic upgrade head
        working-directory: backend
        env:
          OPENEMR_DB_HOST: 127.0.0.1
          OPENEMR_DB_PORT: 3306
          OPENEMR_DB_USER: raf_app
          OPENEMR_DB_PASSWORD: testpassword
          OPENEMR_DB_NAME: openemr_test

      - name: Alembic history check
        run: alembic current
        working-directory: backend
        env:
          OPENEMR_DB_HOST: 127.0.0.1
          OPENEMR_DB_PORT: 3306
          OPENEMR_DB_USER: raf_app
          OPENEMR_DB_PASSWORD: testpassword
          OPENEMR_DB_NAME: openemr_test

  # ---------------------------------------------------------------------------
  # Deploy to production
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy to production (10.1.0.204)"
    runs-on: ubuntu-latest
    environment: production
    needs: [test, migration-check]
    # Run deploy even when migration-check is skipped (manual override)
    if: always() && needs.test.result == 'success' && (needs.migration-check.result == 'success' || needs.migration-check.result == 'skipped')

    steps:
      - name: Notify deploy start
        if: ${{ vars.WEBHOOK_URL != '' || secrets.WEBHOOK_URL != '' }}
        run: |
          WEBHOOK="${{ secrets.WEBHOOK_URL }}"
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"*RAF Deploy starting* — branch \`${{ github.ref_name }}\` commit \`${{ github.sha }}\` by ${{ github.actor }}\"}" \
            || true

      - name: Zero-downtime deploy via jump host
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          proxy_host: ${{ secrets.JUMP_HOST }}
          proxy_port: ${{ secrets.JUMP_PORT }}
          proxy_username: ${{ secrets.JUMP_USER }}
          proxy_key: ${{ secrets.JUMP_SSH_KEY }}
          timeout: 600s
          command_timeout: 40m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.PROD_DEPLOY_PATH || '/home/ubuntu/raf-intelligence' }}"
            BRANCH="${{ vars.DEPLOY_BRANCH || 'local' }}"
            REPO_URL="https://github.com/mrvmurali1991/raf-intel.git"
            SKIP_MIGRATION="${{ inputs.skip_migration && '1' || '0' }}"
            WEBHOOK_URL="${{ secrets.WEBHOOK_URL }}"

            echo "==> Deploying ${BRANCH} to ${DEPLOY_PATH}"

            # Clone if not a git repo yet
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              [ -f "${DEPLOY_PATH}/.env" ] && cp "${DEPLOY_PATH}/.env" /tmp/raf.env.bak || true
              rm -rf "${DEPLOY_PATH}.new"
              git clone --branch "${BRANCH}" --depth 50 "${REPO_URL}" "${DEPLOY_PATH}.new"
              [ -d "${DEPLOY_PATH}" ] && mv "${DEPLOY_PATH}" "${DEPLOY_PATH}.old.$(date +%s)" || true
              mv "${DEPLOY_PATH}.new" "${DEPLOY_PATH}"
              [ -f /tmp/raf.env.bak ] && cp /tmp/raf.env.bak "${DEPLOY_PATH}/.env" || true
            fi

            cd "${DEPLOY_PATH}"

            if [ ! -f .env ]; then
              echo "ERROR: .env missing at ${DEPLOY_PATH}/.env" >&2
              exit 1
            fi

            chmod +x deploy/zero-downtime-deploy.sh deploy/rollback.sh deploy/smoke-test.sh

            # Export webhook for deploy script notifications
            export WEBHOOK_URL
            export SKIP_MIGRATION

            ./deploy/zero-downtime-deploy.sh --branch "${BRANCH}"
            echo "==> Deploy script complete on $(hostname)"

      - name: Run smoke tests after deploy
        id: smoke
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          proxy_host: ${{ secrets.JUMP_HOST }}
          proxy_port: ${{ secrets.JUMP_PORT }}
          proxy_username: ${{ secrets.JUMP_USER }}
          proxy_key: ${{ secrets.JUMP_SSH_KEY }}
          timeout: 120s
          command_timeout: 5m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.PROD_DEPLOY_PATH || '/home/ubuntu/raf-intelligence' }}"
            cd "${DEPLOY_PATH}"

            # Source backend port from .env (default 8500)
            BACKEND_PORT=$(grep '^BACKEND_PORT=' .env | cut -d= -f2 | tr -d '"' || echo "8500")
            BACKEND_PORT="${BACKEND_PORT:-8500}"

            export SMOKE_BASE_URL="http://localhost:${BACKEND_PORT}"
            export SMOKE_RETRIES=6
            export SMOKE_RETRY_DELAY=10

            ./deploy/smoke-test.sh
            echo "==> Smoke tests passed"

      - name: Rollback on smoke test failure
        if: failure() && steps.smoke.conclusion == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          proxy_host: ${{ secrets.JUMP_HOST }}
          proxy_port: ${{ secrets.JUMP_PORT }}
          proxy_username: ${{ secrets.JUMP_USER }}
          proxy_key: ${{ secrets.JUMP_SSH_KEY }}
          timeout: 300s
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.PROD_DEPLOY_PATH || '/home/ubuntu/raf-intelligence' }}"
            cd "${DEPLOY_PATH}"
            echo "==> Smoke tests failed — initiating rollback to previous image"
            ./deploy/rollback.sh previous
            echo "==> Rollback complete"

      - name: Notify deploy success
        if: success()
        run: |
          WEBHOOK="${{ secrets.WEBHOOK_URL }}"
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"attachments\":[{\"color\":\"good\",\"text\":\"*RAF Deploy SUCCESS* — \`${{ github.sha }}\` deployed to production by ${{ github.actor }}\"}]}" \
            || true

      - name: Notify deploy failure
        if: failure()
        run: |
          WEBHOOK="${{ secrets.WEBHOOK_URL }}"
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"attachments\":[{\"color\":\"danger\",\"text\":\"*RAF Deploy FAILED* — \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`. Rollback may have been triggered. Check Actions logs.\"}]}" \
            || true
