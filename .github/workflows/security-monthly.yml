name: Monthly Security Scan

on:
  schedule:
    # First day of every month at 08:00 UTC
    - cron: "0 8 1 * *"
  workflow_dispatch:   # on-demand trigger

permissions:
  contents: write          # to commit the report
  security-events: write   # to upload SARIF

env:
  PYTHON_VERSION: "3.11"

jobs:
  security-monthly:
    name: Full Security Scan
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      # ── pip-audit ──
      - name: pip-audit (full)
        id: pip_audit
        run: |
          pip-audit -r backend/requirements.txt \
            --output=json --output-file=/tmp/pip-audit.json || true
          pip-audit -r backend/requirements.txt 2>&1 | tee /tmp/pip-audit.txt || true

      # ── bandit ──
      - name: bandit SAST
        run: |
          bandit -r backend/app/ -f txt -o /tmp/bandit.txt -ll -ii || true

      # ── Trivy — backend image ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: raf-backend:monthly-scan
          load: true

      - name: Trivy image scan (all severities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: raf-backend:monthly-scan
          format: json
          output: /tmp/trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # report only, do not fail the job

      - name: Trivy SARIF upload
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: raf-backend:monthly-scan
          format: sarif
          output: trivy-monthly.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-monthly.sarif
          category: trivy-monthly

      # ── Build markdown report ──
      - name: Generate markdown report
        run: |
          REPORT_DATE=$(date +%Y-%m-%d)
          REPORT_PATH="docs/security/monthly-scan-${REPORT_DATE}.md"

          mkdir -p docs/security

          cat > "${REPORT_PATH}" <<MDEOF
          # Monthly Security Scan — ${REPORT_DATE}

          > Auto-generated by [security-monthly.yml](../../.github/workflows/security-monthly.yml)
          > Triggered by: \`${{ github.event_name }}\` | Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## pip-audit (Python dependencies)

          \`\`\`
          $(cat /tmp/pip-audit.txt 2>/dev/null || echo "No output")
          \`\`\`

          ## Bandit SAST (backend/app/)

          \`\`\`
          $(cat /tmp/bandit.txt 2>/dev/null || echo "No issues found")
          \`\`\`

          ## Trivy Container Scan Summary

          | Severity | Count |
          |----------|-------|
          | CRITICAL | $(python3 -c "import json; d=json.load(open('/tmp/trivy.json')); vulns=[v for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or [])]; print(sum(1 for v in vulns if v.get('Severity')=='CRITICAL'))" 2>/dev/null || echo "N/A") |
          | HIGH     | $(python3 -c "import json; d=json.load(open('/tmp/trivy.json')); vulns=[v for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or [])]; print(sum(1 for v in vulns if v.get('Severity')=='HIGH'))" 2>/dev/null || echo "N/A") |
          | MEDIUM   | $(python3 -c "import json; d=json.load(open('/tmp/trivy.json')); vulns=[v for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or [])]; print(sum(1 for v in vulns if v.get('Severity')=='MEDIUM'))" 2>/dev/null || echo "N/A") |
          | LOW      | $(python3 -c "import json; d=json.load(open('/tmp/trivy.json')); vulns=[v for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or [])]; print(sum(1 for v in vulns if v.get('Severity')=='LOW'))" 2>/dev/null || echo "N/A") |

          _Full Trivy JSON artifact available in the Actions run._
          MDEOF

          echo "REPORT_PATH=${REPORT_PATH}" >> $GITHUB_ENV

      - name: Upload raw Trivy JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-monthly-${{ github.run_id }}
          path: /tmp/trivy.json
          retention-days: 90

      - name: Commit security report to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.REPORT_PATH }}"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: monthly security scan report $(date +%Y-%m-%d)"
            git push
          fi
