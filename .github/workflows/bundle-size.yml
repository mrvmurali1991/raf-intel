name: Bundle Size Gate

on:
  push:
    branches:
      - server
      - main
      - develop
  pull_request:
    branches:
      - server
      - main
      - develop

defaults:
  run:
    working-directory: frontend

jobs:
  bundle-size:
    name: Check per-route First Load JS budgets
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (webpack)
        run: npm run build
        env:
          # Prevent Next.js telemetry noise in CI logs
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Analyze bundle — write bundle-audit.json
        run: node scripts/analyze-bundle.cjs

      - name: Enforce bundle budgets
        # Exits 1 and fails the workflow if any route exceeds its gzip budget:
        #   ≤ 250 kB gz  →  /, /login, /patients, /review-queue
        #   ≤ 350 kB gz  →  all other routes
        run: node scripts/check-bundle-size.cjs

      - name: Upload bundle-audit.json on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-audit
          path: frontend/.next/bundle-audit.json
          retention-days: 7
