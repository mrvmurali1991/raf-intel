[pytest]
# ---------------------------------------------------------------------------
# RAF Intelligence — pytest configuration
# ---------------------------------------------------------------------------

# Where to find tests
testpaths = tests

# Minimum pytest version required
minversion = 7.0

# Default options applied to every run
addopts =
    # Short traceback format keeps output readable for deep FastAPI stacks
    --tb=short
    # Show which tests were skipped and why
    -rN
    # Verbose output: one line per test
    -v
    # Stop after the first 10 failures to avoid drowning in noise
    --maxfail=10
    # Emit real-time stdout/stderr (useful when debugging Gemini timeouts)
    -s
    # Coverage: measure app package, show missing lines, enforce 80% minimum
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=80

# Timeout (requires pytest-timeout — install with: pip install pytest-timeout)
# Each test is allowed up to 150 s to handle slow Gemini analysis calls.
# Comment this out if pytest-timeout is not installed.
# timeout = 150

# Custom markers — declare them here to avoid PytestUnknownMarkWarning
markers =
    slow: Tests that call the Gemini API and may take 10-60 seconds each.
    clinical: Tests that validate medical/clinical correctness.
    integration: Integration tests that require a live backend server.
    golden: CMS golden test fixtures — fixed expected values that must never regress.
    security: Security tests (SQL injection, path traversal, CORS, tenant isolation).
    contract: API contract tests validating response schema.
    pipeline: Pipeline integration and event-chain tests.

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
# Target 80% statement coverage across the app package.
# Run with: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
# The CI pipeline enforces this threshold; increase incrementally as coverage grows.
# To run without the threshold (for quick local checks):
#   pytest --cov=app --no-cov-on-fail
# ---------------------------------------------------------------------------

# Log level captured during tests (visible with -s or on failure)
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Treat these warnings as errors to keep the codebase clean
filterwarnings =
    # hccinfhir 0.3.x uses the legacy importlib.resources.path() API which emits
    # a DeprecationWarning on Python 3.11+.  The library catches "Exception"
    # broadly and re-raises it as RuntimeError, so this ignore MUST come before
    # the project-wide error::DeprecationWarning rule below.
    ignore:path is deprecated:DeprecationWarning:importlib
    # hccinfhir internal deprecation warnings
    ignore::DeprecationWarning:hccinfhir
    # httpx compatibility shim warnings can be noisy
    ignore::UserWarning:httpx
    # urllib3 ssl warnings on some macOS builds
    ignore::urllib3.exceptions.InsecureRequestWarning
    # Pydantic v2 field validators emit these during model construction
    ignore:Field.*needs to be converted:UserWarning
    # SQLAlchemy 2.0 transition warnings
    ignore::sqlalchemy.exc.SADeprecationWarning
    # FastAPI/Starlette deprecation noise
    ignore::DeprecationWarning:starlette
    ignore::DeprecationWarning:fastapi
    # pydantic deprecation warnings
    ignore::DeprecationWarning:pydantic
    # anyio / sniffio internal deprecations
    ignore::DeprecationWarning:anyio
    # General deprecation warnings — log loudly but do NOT fail the suite.
    # A separate CI lint step can enforce zero project-level deprecations.
    default::DeprecationWarning
    default::PendingDeprecationWarning
