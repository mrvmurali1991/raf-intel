# mypy.ini — RAF Intelligence backend type-checking baseline
# Strategy: strict mode with targeted relaxations to bootstrap incrementally.
# DO NOT set ignore_errors = True; use per-module overrides below instead.
#
# Run:   mypy backend/app
# CI:    scripts/check_mypy_baseline.sh  (fails if error count increases)

[mypy]
python_version = 3.11
strict = True

# Bootstrap relaxations — remove gradually as types are improved
follow_imports = silent
check_untyped_defs = True
warn_return_any = True
disallow_untyped_defs = False          ; off globally, on per-module below
disallow_any_generics = False
disallow_untyped_calls = False
warn_unused_ignores = False

# Ignore missing stubs for third-party libraries without py.typed markers
ignore_missing_imports = True

# ---------------------------------------------------------------------------
# Per-module overrides: tighter rules on the RAF engine and API layer
# ---------------------------------------------------------------------------

[mypy-app.services.raf.*]
disallow_untyped_defs = True

[mypy-app.routers.*]
disallow_untyped_defs = True

# ---------------------------------------------------------------------------
# Third-party libraries — silence any residual import noise
# ---------------------------------------------------------------------------

[mypy-hccinfhir.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

