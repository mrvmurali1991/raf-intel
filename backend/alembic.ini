# Alembic configuration for RAF Intelligence backend.
#
# Usage:
#   alembic upgrade head          — apply all pending migrations
#   alembic upgrade +1            — apply the next migration only
#   alembic downgrade -1          — roll back the last migration
#   alembic revision --autogenerate -m "describe_change"  — generate a new migration
#   alembic current               — show the current revision
#   alembic history               — list all revisions
#
# The database URL is NOT stored here; env.py reads it from app/config.py
# (which in turn reads RAF_DB_HOST / RAF_DB_PORT / RAF_DB_USER etc. from .env).

[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = alembic

# Jinja2 template used when generating new migration files.
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with this directory so that `from app.config import settings`
# works when alembic is invoked from the backend/ directory.
prepend_sys_path = .

# Truncate long revision messages in filenames at this length.
truncate_slug_length = 40

# Timezone for revision timestamps in generated file names.
timezone = UTC

# Set to "true" to run the environment during the "revision" command, even
# if autogenerate is not being used (helps catch import errors early).
revision_environment = false

# SQLAlchemy URL placeholder — overridden in env.py at runtime.
# Leave as a dummy value; env.py calls config.set_main_option() with the real URL.
sqlalchemy.url = driver://user:pass@localhost/dbname


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
