# Case 01 — Demographic-only, Community Non-dual Aged (CNA)
#
# Source: CMS-HCC V28 coefficient table, CY2024 Rate Announcement — Community,
# Non-dual, Aged segment, age 70-74 male. Coefficient M70_74 = 0.396.
# hccinfhir v0.3.0 loads this table verbatim from the CMS-published file
# (see hccinfhir/data/ry2024_community_coefficients.csv).
#
# Purpose: floor case — confirms demographic base rate is applied even with
# zero diagnoses. Regression trip-wire for accidental zeroing of demo score.
id: demographic_only_cna
description: 70M, no diagnoses, CNA segment — demographic base rate only
inputs:
  age: 70
  sex: M
  model_segment: CNA
  icd10_codes: []
expected:
  total_raf: 0.396
  demographic_score: 0.396
  disease_score: 0.0
  hcc_list: []
  hcc_coefficients: {}
  model_version: "CMS-HCC Model V28"
  payment_year: 2024
tolerance: 0.0001
