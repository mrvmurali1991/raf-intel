# ---------------------------------------------------------------------------
# RAF Intelligence — Simple Production Compose (with Celery/Redis)
#
# For the hardened production stack with nginx/TLS, use:
#   docker compose -f docker-compose.prod.yml up -d
#
# This file is suitable for single-server deployments where the backend
# connects to an external MySQL database (e.g., host machine or RDS).
# ---------------------------------------------------------------------------

services:
  redis:
    image: redis:7.2.7-alpine
    container_name: raf-redis
    restart: unless-stopped
    mem_limit: 128m
    command: >
      redis-server
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --loglevel warning
        --requirepass ${REDIS_PASSWORD:-rafredis123}
    volumes:
      - redis_data:/data
    networks:
      - raf-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rafredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: raf-backend:${IMAGE_TAG:-latest}
    container_name: raf-backend
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "${BACKEND_PORT:-8500}:8500"
    env_file: .env
    environment:
      RAF_DB_HOST: ${RAF_DB_HOST:-host.docker.internal}
      RAF_DB_PORT: ${RAF_DB_PORT:-3306}
      OPENEMR_DB_HOST: ${OPENEMR_DB_HOST:-mysql}
      OPENEMR_DB_PORT: ${OPENEMR_DB_PORT:-3306}
      OPENEMR_URL: http://openemr:80
      REDIS_URL: redis://:${REDIS_PASSWORD:-rafredis123}@redis:6379/0
      STRICT_MIGRATIONS: ${STRICT_MIGRATIONS:-false}
      PHI_FERNET_KEY: ${PHI_FERNET_KEY:-}
      PHI_AES256_KEY: ${PHI_AES256_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./models:/app/models:ro
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    networks:
      - raf-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8500/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: raf-worker:${IMAGE_TAG:-latest}
    container_name: raf-worker
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      RAF_DB_HOST: ${RAF_DB_HOST:-host.docker.internal}
      RAF_DB_PORT: ${RAF_DB_PORT:-3306}
      OPENEMR_DB_HOST: ${OPENEMR_DB_HOST:-mysql}
      OPENEMR_DB_PORT: ${OPENEMR_DB_PORT:-3306}
      OPENEMR_URL: http://openemr:80
      REDIS_URL: redis://:${REDIS_PASSWORD:-rafredis123}@redis:6379/0
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    networks:
      - raf-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.services.celery_tasks inspect ping --destination worker@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://raf-api.comercioit.com}
    image: raf-frontend:${IMAGE_TAG:-latest}
    container_name: raf-frontend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - raf-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: raf-mysql
    restart: unless-stopped
    mem_limit: 1g
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=100
      --table-open-cache=200
      --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}  # DEV ONLY - never use in production
      MYSQL_DATABASE: openemr
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - raf-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  openemr:
    image: openemr/openemr:7.0.2
    container_name: raf-openemr
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${OPENEMR_PORT:-8080}:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: root
      MYSQL_PASS: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: openemr
      OE_USER: ${OE_USER:-admin}
      OE_PASS: ${OE_PASS:-pass}
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
      - openemr_logs:/var/log
    networks:
      - raf-net
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  raf-net:
    driver: bridge

volumes:
  redis_data:
  mysql_data:
  openemr_sites:
  openemr_logs:
